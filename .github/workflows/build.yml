name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build TrackLauncher.slnx -c Release

      - name: Publish (win-x64, self-contained)
        run: dotnet publish src/TrackLauncher.App/TrackLauncher.App.csproj -c Release -r win-x64 --self-contained true -o publish/TrackLauncher

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish/TrackLauncher/* -DestinationPath TrackLauncher-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TrackLauncher-win-x64
          path: TrackLauncher-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TrackLauncher-win-x64.zip
          generate_release_notes: true
